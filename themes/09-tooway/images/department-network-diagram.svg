<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
<title id="title">Структура відомчої системи супутникового зв’язку України Tooway</title>
<desc id="desc">Супутник KA-SAT, центральна станція Skylogic, провайдер Датагруп, АСУ Дніпро з сервісами SIP, WEB та E-MAIL, дві станції користувачів із комп’ютерами й телефонами. Повний маршрут між користувачами наведено в окремій схемі нижче.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7Z" fill="#317869"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17212b}.heading{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#506273}.label{font-size:16px;font-weight:700;letter-spacing:1px;fill:#1d6b57}.box{fill:#fff;stroke:#a5bcb3;stroke-width:2}.link{fill:none;stroke:#317869;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.wire{fill:none;stroke:#8a6500;stroke-width:2}</style>
<g id="computer" fill="none" stroke="#317869" stroke-width="2"><rect x="-23" y="-17" width="46" height="30" rx="3"/><path d="M-29 19H29L23 13H-23Z"/></g>
