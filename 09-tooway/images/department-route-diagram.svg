<text x="550" y="76" text-anchor="middle" class="body">Прямого з’єднання між користувачами немає</text>
<text x="280" y="119" text-anchor="middle" class="body" style="fill:#ab5925;font-weight:700">↓ До АСУ «Дніпро»</text>
<text x="820" y="119" text-anchor="middle" class="body" style="fill:#176a92;font-weight:700">↑ Від АСУ до одержувача</text>
