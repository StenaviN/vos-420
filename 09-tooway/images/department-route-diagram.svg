<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-labelledby="title desc">
<title id="title">Повний маршрут зв’язку між користувачами Tooway через АСУ «Дніпро»</title>
<desc id="desc">Користувач 1, супутник KA-SAT, центральна станція Skylogic, провайдер Датагруп, АСУ Дніпро, провайдер Датагруп, центральна станція Skylogic, супутник KA-SAT, користувач 2. Прямого з’єднання між користувачами немає. Повторені блоки позначають повторне проходження тих самих вузлів.</desc>
<defs><marker id="down" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 7 4 1 7Z" fill="#ab5925"/></marker><marker id="up" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 7 4 1 7Z" fill="#176a92"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17212b}.title{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#506273}.step{font-size:19px;font-weight:700;fill:white}.down{fill:none;stroke:#ab5925;stroke-width:4;marker-end:url(#down)}.up{fill:none;stroke:#176a92;stroke-width:4;marker-end:url(#up)}</style></defs>
<rect width="1100" height="1060" rx="16" fill="#f5f7f6"/>
