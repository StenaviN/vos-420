<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
  <title id="title">Три сегменти системи TOOWAY</title>
  <desc id="desc">Супутник KA-SAT 9A, власник Eutelsat, Франція, забезпечує двосторонній зв’язок між терміналами користувачів TOOWAY і наземним сегментом Skylogic, Італія. Наземний сегмент містить десять шлюзових станцій, об’єднаних мережевою інфраструктурою з доступом до Інтернету.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7Z" fill="#317869"/></marker>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17212b}.title{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#506273}.label{font-size:16px;font-weight:700;letter-spacing:1px;fill:#1d6b57}.line{fill:none;stroke:#317869;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="690" rx="16" fill="#f5f7f6"/>
  <rect x="225" y="25" width="510" height="190" rx="14" fill="#e9f3ef" stroke="#1d6b57" stroke-width="2"/>
  <text x="480" y="62" text-anchor="middle" class="label">1 · СУПУТНИКОВИЙ СЕГМЕНТ</text>
  <g transform="translate(480 104)" fill="none" stroke="#1d6b57" stroke-width="2.5"><rect x="-15" y="-18" width="30" height="36" rx="4"/><path d="M-15 0H-65M15 0H65"/><rect x="-65" y="-13" width="38" height="26" rx="2"/><rect x="27" y="-13" width="38" height="26" rx="2"/><path d="M-46-13V13M46-13V13M-5 18L-14 29M5 18L14 29"/></g>
  <text x="480" y="155" text-anchor="middle" class="title">KA-SAT 9A</text>
  <text x="480" y="188" text-anchor="middle" class="body">Власник: Eutelsat, Франція</text>
  <path d="M345 229 225 314" class="line"/>
  <path d="M615 229 735 314" class="line"/>
  <text x="480" y="265" text-anchor="middle" class="small">Супутникові канали</text>
  <text x="480" y="292" text-anchor="middle" class="small">двостороннього зв’язку</text>
  <rect x="25" y="330" width="445" height="330" rx="14" fill="#fff" stroke="#a5bcb3" stroke-width="2"/>
  <text x="247" y="367" text-anchor="middle" class="label">2 · НАЗЕМНИЙ СЕГМЕНТ</text>
  <text x="247" y="404" text-anchor="middle" class="title">Керування та надання послуг</text>
  <text x="247" y="438" text-anchor="middle" class="body">Skylogic, Італія</text>
  <rect x="68" y="461" width="359" height="49" rx="8" fill="#e9f3ef"/>
  <text x="247" y="493" text-anchor="middle" class="body">10 шлюзових станцій</text>
  <path d="M247 521V543" class="line"/>
  <text x="247" y="574" text-anchor="middle" class="body">Наземна мережева інфраструктура</text>
  <path d="M247 587V608" class="line"/>
  <text x="247" y="639" text-anchor="middle" class="title">Інтернет</text>
  <rect x="490" y="330" width="445" height="330" rx="14" fill="#fff" stroke="#a5bcb3" stroke-width="2"/>
  <text x="712" y="367" text-anchor="middle" class="label">3 · СЕГМЕНТ КОРИСТУВАЧІВ</text>
  <text x="712" y="404" text-anchor="middle" class="title">Абонентські термінали TOOWAY</text>
  <g stroke="#317869" fill="#e9f3ef" stroke-width="2.5">
    <path d="M555 460Q555 511 607 511Z"/><path d="M578 488 601 466M578 497V535M560 535H595"/>
    <path d="M686 460Q686 511 738 511Z"/><path d="M709 488 732 466M709 497V535M691 535H726"/>
    <path d="M817 460Q817 511 869 511Z"/><path d="M840 488 863 466M840 497V535M822 535H857"/>
  </g>
  <text x="712" y="577" text-anchor="middle" class="body">Розподілені наземні станції</text>
  <text x="712" y="607" text-anchor="middle" class="body">користувачів</text>
  <text x="712" y="639" text-anchor="middle" class="small">Доступ до мережі через супутник</text>
</svg>
